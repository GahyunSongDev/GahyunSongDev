<svg viewBox="0 0 1300 620" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <defs>
          <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                  <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
          </marker>
          <marker id="arrTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                  <path d="M0,0 L10,5 L0,10 z" fill="#0EA5A4"/>
          </marker>
    </defs>

    <rect x="0" y="0" width="1300" height="620" fill="#FFFFFF"/>

    <text x="40" y="46" font-size="20" font-weight="700" fill="#1B2333">CI/CD Architecture - GitHub Actions + ArgoCD + Argo Rollouts</text>
    <text x="40" y="68" font-size="12.5" fill="#6B7280">Owned end-to-end: CI pipeline design, GitOps sync, per-service rollout strategy</text>

    <rect x="40" y="100" width="560" height="150" rx="10" fill="#F0FDFA" stroke="#99F6E4"/>
    <text x="60" y="126" font-size="12" font-weight="700" fill="#0F766E">CI - GitHub Actions</text>

    <g font-size="11.5" fill="#1B2333">
          <rect x="60" y="150" width="150" height="60" rx="6" fill="#FFFFFF" stroke="#5EEAD4"/>
          <text x="70" y="175" font-weight="600">Detect changed</text>
          <text x="70" y="191">service</text>

          <path d="M210 180 L240 180" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>

          <rect x="240" y="150" width="150" height="60" rx="6" fill="#FFFFFF" stroke="#5EEAD4"/>
          <text x="250" y="175" font-weight="600">Build + push</text>
          <text x="250" y="191">to ECR</text>

          <path d="M390 180 L420 180" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>

          <rect x="420" y="150" width="150" height="60" rx="6" fill="#FFFFFF" stroke="#5EEAD4"/>
          <text x="430" y="172" font-weight="600">Update tag in</text>
          <text x="430" y="188">INFRA repo (yq)</text>
    </g>

    <path d="M320 250 L320 290" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="180" y="292" width="280" height="56" rx="8" fill="#1B2333"/>
    <text x="320" y="316" text-anchor="middle" font-size="12" font-weight="700" fill="#F5F7FA">INFRA repo</text>
    <text x="320" y="334" text-anchor="middle" font-size="11" fill="#9CA3AF">values-dev / values-prod.yaml</text>

    <path d="M320 348 L320 388" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="130" y="390" width="380" height="60" rx="8" fill="#182236" stroke="#F59E0B"/>
    <text x="320" y="415" text-anchor="middle" font-size="12" font-weight="700" fill="#F5F7FA">ArgoCD</text>
    <text x="320" y="433" text-anchor="middle" font-size="11" fill="#D4A24A">Detects drift (3min poll) -&gt; syncs</text>

    <path d="M510 420 L620 420" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="620" y="100" width="640" height="440" rx="10" fill="#101826"/>
    <text x="940" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#F5F7FA">Argo Rollouts - per-service strategy</text>

    <g font-size="11.5">
          <rect x="650" y="155" width="270" height="70" rx="6" fill="#182236" stroke="#5EEAD4"/>
          <text x="665" y="178" font-weight="700" fill="#5EEAD4">Payment / User</text>
          <text x="665" y="196" fill="#C7D0DD">Blue-Green</text>
          <text x="665" y="212" fill="#8B96A8" font-size="10.5">Manual gate on Payment (data integrity)</text>

          <rect x="650" y="240" width="270" height="70" rx="6" fill="#182236" stroke="#FCD34D"/>
          <text x="665" y="263" font-weight="700" fill="#FCD34D">Trade / Order</text>
          <text x="665" y="281" fill="#C7D0DD">Canary + AnalysisRun</text>
          <text x="665" y="297" fill="#8B96A8" font-size="10.5">Auto-promote on passing metrics</text>

          <rect x="650" y="325" width="270" height="70" rx="6" fill="#182236" stroke="#F59E0B"/>
          <text x="665" y="348" font-weight="700" fill="#F59E0B">Product</text>
          <text x="665" y="366" fill="#C7D0DD">Canary + Feature Flag</text>
          <text x="665" y="382" fill="#8B96A8" font-size="10.5">90%+ of traffic - flag-gated rollout</text>
    </g>

    <path d="M920 190 L960 190 L960 470" stroke="#5EEAD4" stroke-width="2" fill="none"/>
    <path d="M920 275 L960 275 L960 470" stroke="#FCD34D" stroke-width="2" fill="none"/>
    <path d="M920 360 L960 360 L960 470" stroke="#F59E0B" stroke-width="2" fill="none" marker-end="url(#arr)"/>

    <rect x="810" y="470" width="300" height="60" rx="8" fill="#182236" stroke="#4FD1C5"/>
    <text x="960" y="495" text-anchor="middle" font-size="12" font-weight="700" fill="#4FD1C5">Prometheus + Grafana</text>
    <text x="960" y="513" text-anchor="middle" font-size="11" fill="#8B96A8">error rate : latency : success rate</text>

    <path d="M810 500 C 560 500, 560 300, 620 235" stroke="#4FD1C5" stroke-width="2.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arrTeal)"/>
    <text x="565" y="290" font-size="10.5" fill="#0EA5A4" transform="rotate(-90 565 290)">threshold breach -&gt; rollback</text>

    <rect x="40" y="560" width="1220" height="46" rx="8" fill="#F0FDFA" stroke="#99F6E4"/>
    <text x="60" y="588" font-size="12.5" fill="#0F766E" font-weight="600">Result: 0s downtime across all services : automated rollback (MTTR ~30s, 90% reduction) : deploy lead time 6min (60% improvement)</text>
</svg>
