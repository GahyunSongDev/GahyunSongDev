    <line x1="915" y1="184" x2="1295" y2="184" stroke="#293449"/>

    <text x="915" y="206" font-size="11.5" fill="#C7D0DD">All 5 services → Blue-Green</text>
    <text x="915" y="224" font-size="11.5" fill="#C7D0DD">Payment adds a Manual Gate</text>
    <text x="915" y="242" font-size="10.5" fill="#8B96A8">Canary piloted, moved off pre-launch</text>

    <rect x="915" y="260" width="360" height="44" rx="6" fill="#182236"/>
    <text x="925" y="277" font-size="10.5" fill="#8B96A8">Result</text>
    <text x="925" y="294" font-size="12" font-weight="700" fill="#4FD1C5">0s downtime · MTTR 90%↓ · Lead time 60%↓</text>

    <text x="915" y="330" font-size="10.5" fill="#8B96A8">My role: CI/CD architecture (GitHub Actions + ArgoCD/</text>
    <text x="915" y="345" font-size="10.5" fill="#8B96A8">Argo Rollouts). Terraform infra co-designed with teammate.</text>
  </g>
